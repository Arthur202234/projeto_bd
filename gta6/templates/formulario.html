<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>GTA 6 - Formulário</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>
<body>
    <div class="container">
        <nav>
            <a href="/">Início</a>
            <a href="/formulario">Formulário GTA 6</a>
            <a href="/dados">Lista de Jogadores</a>
        </nav>

        <h1>Formulário - GTA 6</h1>
        <form action="/formulario" method="POST">
            <label for="nome">Seu nome:</label>
            <input type="text" id="nome" name="nome" required>

            <label for="nick_jogo">Seu nick no jogo:</label>
            <input type="text" id="nick_jogo" name="nick_jogo" required>

            <label for="vai_jogar">Você vai jogar GTA 6?</label>
            <select id="vai_jogar" name="vai_jogar" required>
                <option value="">Selecione...</option>
                <option value="Sim">Sim</option>
                <option value="Não">Não</option>
                <option value="Talvez">Talvez</option>
            </select>

            <button type="submit">Enviar</button>
        </form>
    </div>
</body>
</html>
