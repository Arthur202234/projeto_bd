<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>GTA 6 - Formulário de Jogador</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="/">GTA VI <span>HUB</span></a>
            <nav>
                <a href="/">Início</a>
                <a href="/formulario">Formulário</a>
                <a href="/dados">Jogadores</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <span class="tag">Cadastro • Vice City</span>
            <h1>Registrar Jogador</h1>
            <p>Preencha seus dados abaixo para entrar na lista oficial da galera que está aguardando Grand Theft Auto VI.</p>
        </section>

        <section class="form-box">
            <form action="/formulario" method="POST">
                <label for="nome">Seu nome</label>
                <input type="text" id="nome" name="nome" placeholder="Ex: Resenha" required>

                <label for="nick_jogo">Seu nick no jogo</label>
                <input type="text" id="nick_jogo" name="nick_jogo" placeholder="" required>

                <label for="vai_jogar">Você vai jogar GTA 6?</label>
                <select id="vai_jogar" name="vai_jogar" required>
                    <option value="">Selecione uma opção...</option>
                    <option value="Sim">Sim</option>
                    <option value="Talvez">Talvez</option>
                    <option value="Não">Não</option>
                </select>

                <button type="submit">Salvar Cadastro</button>
            </form>
        </section>
    </main>
</body>
</html>
